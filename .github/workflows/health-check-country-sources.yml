name: Health Check — Country Sources

permissions:
  contents: read
  issues: write

on:
  schedule:
    # 週次: 毎週土曜 01:00 UTC (10:00 JST) — auto-country (水・日) と重複なし
    - cron: "0 1 * * 6"
    # 月次: 毎月1日 02:00 UTC — unverified の再試行含む全件チェック
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "recheck-dead | recheck-unverified | recheck-all | re-verify"
        required: false
        default: "recheck-dead"

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Weekly — recheck dead + unverified
        id: weekly
        if: github.event_name == 'schedule' && contains(github.event.schedule, '* * 6')
        run: |
          set +e
          npx tsx scripts/verify-country-sources.ts --recheck-dead --recheck-unverified 2>&1 | tee /tmp/weekly-recheck.log
          exit_code=${PIPESTATUS[0]}
          # dead URL確定検出時のみ verify-country-sources.ts が出力するマーカー文字列で判定する
          # （npm ci失敗・DB接続失敗等の他要因によるexit 1と区別するため。exit codeは変更しない）
          if grep -q "件の dead URL があります" /tmp/weekly-recheck.log; then
            echo "dead_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "dead_found=false" >> "$GITHUB_OUTPUT"
          fi
          exit $exit_code
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Monthly — full re-verify (all statuses)
        id: monthly_reverify
        if: github.event_name == 'schedule' && contains(github.event.schedule, '1 * *')
        run: |
          set +e
          npx tsx scripts/verify-country-sources.ts --recheck-dead --recheck-unverified --re-verify 2>&1 | tee /tmp/monthly-recheck.log
          exit_code=${PIPESTATUS[0]}
          if grep -q "件の dead URL があります" /tmp/monthly-recheck.log; then
            echo "dead_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "dead_found=false" >> "$GITHUB_OUTPUT"
          fi
          exit $exit_code
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Monthly — content hash check (ソース更新検知)
        if: github.event_name == 'schedule' && contains(github.event.schedule, '1 * *')
        run: npx tsx scripts/check-source-content-hash.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Manual dispatch
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          set +e
          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "recheck-dead" ]; then
            npx tsx scripts/verify-country-sources.ts --recheck-dead 2>&1 | tee /tmp/manual-recheck.log
          elif [ "$MODE" = "recheck-unverified" ]; then
            npx tsx scripts/verify-country-sources.ts --recheck-unverified 2>&1 | tee /tmp/manual-recheck.log
          elif [ "$MODE" = "recheck-all" ]; then
            npx tsx scripts/verify-country-sources.ts --recheck-dead --recheck-unverified 2>&1 | tee /tmp/manual-recheck.log
          elif [ "$MODE" = "re-verify" ]; then
            npx tsx scripts/verify-country-sources.ts --re-verify 2>&1 | tee /tmp/manual-recheck.log
          fi
          exit_code=${PIPESTATUS[0]}
          if [ -f /tmp/manual-recheck.log ] && grep -q "件の dead URL があります" /tmp/manual-recheck.log; then
            echo "dead_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "dead_found=false" >> "$GITHUB_OUTPUT"
          fi
          exit $exit_code
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # dead URL確定検出時のみ実行する（npm ci失敗・DB接続失敗等の他要因による失敗では作成しない）。
      # 同一タイトルのopen issueがあれば重複作成しない（週次・月次が同日実行される場合の重複対策）。
      - name: Create GitHub Issue on dead URL detection
        if: |
          always() &&
          (steps.weekly.outputs.dead_found == 'true' || steps.monthly_reverify.outputs.dead_found == 'true' || steps.manual.outputs.dead_found == 'true')
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[country-sources] dead URL 検出';
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} type:issue state:open in:title "${title}"`,
            });
            const existing = search.data.items.find((i) => i.title === title);
            if (existing) {
              core.notice(`既存Issue #${existing.number} が open のため新規作成をskip`);
              await core.summary.addRaw(`既存Issue #${existing.number} が open のため新規作成をskipしました。`).write();
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## country_sources ヘルスチェックで dead URL を検出しました',
                '',
                '**対応手順:**',
                '1. GitHub Actions のログで dead URL 一覧を確認',
                '2. `scripts/verify-country-sources.ts --recheck-dead` を手動実行して詳細確認',
                '3. 置換 URL を特定して `country_sources` を `source=manual` で更新',
                '4. 該当記事の参考文献欄を差し替え',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['bug', 'content'],
            });
